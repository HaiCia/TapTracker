<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TapTracker</title>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="style.css?v=desktop-dock-v1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <div class="header-top">
        <div class="header-logo">TAPTRACKER</div>

        <div class="header-actions">
          <button
            id="view-toggle-btn"
            onclick="toggleViewMode()"
            class="filter-btn"
          >
          All Pubs
          </button>

          <div class="user-menu-container">
            <button
              class="filter-btn"
              onclick="toggleUserMenu()"
              id="user-display"
            >
              User ▼
            </button>

            <div class="user-dropdown" id="user-dropdown">
              <div class="friend-code-section">
                FRIEND CODE
                <div class="friend-code-input-row">
                  <input
                    id="friend-code-input"
                    type="text"
                    readonly
                    value="⏳..."
                    title="Your friend code — share this with friends"
                    aria-label="Friend Code"
                  />
                  <button
                    id="btn-copy-code"
                    onclick="copyFriendCode()"
                    title="Copy code"
                    aria-label="Copy friend code"
                    class="fc-btn"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                  </button>
                  <button
                    id="btn-regen-code"
                    onclick="rotateFriendCode()"
                    title="Regenerate code"
                    aria-label="Regenerate friend code"
                    class="fc-btn"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="23 4 23 10 17 10"></polyline>
                      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <button onclick="compareMap()" class="filter-btn dropdown-item">
                🍻 Compare Map
              </button>
              <button
                style="display: none"
                onclick="stopComparing()"
                id="stop-compare-btn"
                class="filter-btn dropdown-item"
              >
                ❌ Stop Comparing
              </button>
              <button
                onclick="changeNickname()"
                class="filter-btn dropdown-item"
              >
                ✏️ Nickname
              </button>
              <button
                onclick="changePassword()"
                class="filter-btn dropdown-item"
              >
                🔑 Password
              </button>
              <button
                onclick="window.toggleDarkMode()"
                class="filter-btn dropdown-item"
              >
                🌙 Dark Mode
              </button>
              <button
                onclick="logout()"
                class="filter-btn dropdown-item logout-btn"
              >
                🚪 Log Out
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Główny Kontener -->
      <div class="content-area">
        <div
          id="sidebar-toggle-btn"
          class="sidebar-toggle"
          onclick="toggleSidebar()"
        >
          ◀
        </div>

        <div class="map-section">
          <div id="map"></div>
          <div id="map-legend" class="map-legend-wrapper">
            <button
              id="legend-toggle"
              class="legend-toggle-btn"
              type="button"
              aria-label="Toggle Legend"
              title="Toggle Map Legend"
              onclick="window.toggleLegend(event)"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
            </button>
            <div class="legend-card map-legend">
              <div><span class="legend-pin" style="background:#34495e"><i class="fa-solid fa-beer-mug-empty"></i></span> To Visit</div>
              <div><span class="legend-pin" style="background:#27ae60"><i class="fa-solid fa-check"></i></span> Visited</div>
              <div><span class="legend-pin" style="background:#3498db"><i class="fa-solid fa-user-group"></i></span> Friend</div>
              <div><span class="legend-pin" style="background:#f39c12"><i class="fa-solid fa-champagne-glasses"></i></span> Both</div>
              <div><span class="legend-badge">❤️</span> Favorite</div>
            </div>
          </div>
        </div>

        <div class="info-panel sidebar">
          <div class="sheet-handle-zone"><span class="sheet-handle-bar"></span></div>
          <div class="filters-container">
            <div class="segmented-control-bg">
              <button class="filter-btn active" onclick="setFilter('all', this)">
                All
              </button>
              <button class="filter-btn" onclick="setFilter('visited', this)">
                Visited
              </button>
              <button class="filter-btn" onclick="setFilter('unvisited', this)">
                To Visit
              </button>
              <button class="filter-btn" onclick="setFilter('favorites', this)">
                ❤️ Favorites
              </button>
            </div>
          </div>

          <div class="search-container" style="position: relative;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
            <input
              type="text"
              id="search-input"
              placeholder="SEARCH PUBS..."
              oninput="handleSearch(event)"
              style="padding-left: 36px;"
            />
          </div>

          <div id="pub-info"></div>
          <div id="pub-list-container" class="sheet-content-list"></div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="app.js?v=unified-controls"></script>
  </body>
</html>
