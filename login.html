<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TapTracker - Login</title>
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>
    <link rel="stylesheet" href="style.css" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body class="login-body">
    <div class="login-container">
      <div class="login-title" id="form-title">TAPTRACKER // LOGIN</div>

      <input type="email" id="email" class="login-input" placeholder="EMAIL" />
      <input
        type="password"
        id="password"
        class="login-input"
        placeholder="PASSWORD"
      />

      <div id="error-msg"></div>

      <div
        class="cf-turnstile"
        data-sitekey="1x00000000000000000000AA"
        data-callback="onTurnstileSuccess"
        data-expired-callback="onTurnstileExpired"
        data-error-callback="onTurnstileError"
        style="margin: 4px 0; display: flex; justify-content: center;"
      ></div>

      <button id="login-btn" class="login-btn" onclick="handleAuth()">
        LOG IN
      </button>

      <button class="toggle-mode-btn" onclick="toggleMode()">
        Need an account? Sign up
      </button>
    </div>

    <!-- Supabase i Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="config.js"></script>

    <script type="module">
      import { supabaseClient } from './api.js';
      import { signUpUser, signInUser } from './auth.js';
      import { TURNSTILE_SITE_KEY } from './config.js';
      
      let isSignUp = false;
      let turnstileToken = null;

      // Update sitekey attribute dynamically if configured in config.js
      const turnstileContainer = document.querySelector('.cf-turnstile');
      if (turnstileContainer && TURNSTILE_SITE_KEY) {
        turnstileContainer.setAttribute('data-sitekey', TURNSTILE_SITE_KEY);
      }

      function onTurnstileSuccess(token) {
        turnstileToken = token;
        const errorDiv = document.getElementById("error-msg");
        if (errorDiv && errorDiv.innerText.includes("Turnstile")) {
          errorDiv.innerText = "";
        }
      }

      function onTurnstileExpired() {
        turnstileToken = null;
      }

      function onTurnstileError() {
        turnstileToken = null;
        const errorDiv = document.getElementById("error-msg");
        if (errorDiv) {
          errorDiv.innerText = "Verification failed. Please retry.";
        }
      }

      // Expose callbacks to window for Cloudflare Turnstile API
      window.onTurnstileSuccess = onTurnstileSuccess;
      window.onTurnstileExpired = onTurnstileExpired;
      window.onTurnstileError = onTurnstileError;

      async function handleAuth() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorDiv = document.getElementById("error-msg");
        errorDiv.innerText = "";

        if (!email || !password) {
          errorDiv.innerText = "Fill in all fields!";
          return;
        }

        if (!turnstileToken) {
          errorDiv.innerText = "Please complete the Cloudflare Turnstile verification.";
          return;
        }

        const loginBtn = document.getElementById("login-btn");
        if (loginBtn) loginBtn.disabled = true;

        try {
          let response;
          if (isSignUp) {
            response = await signUpUser(email, password, turnstileToken, supabaseClient);
          } else {
            response = await signInUser(email, password, turnstileToken, supabaseClient);
          }

          if (response.error) {
            errorDiv.innerText = response.error.message;
          } else {
            window.location.href = "index.html";
          }
        } finally {
          if (loginBtn) loginBtn.disabled = false;
          turnstileToken = null;
          if (window.turnstile && typeof window.turnstile.reset === "function") {
            try {
              window.turnstile.reset();
            } catch (resetErr) {
              console.warn("Turnstile reset warning:", resetErr);
            }
          }
        }
      }

      function toggleMode() {
        isSignUp = !isSignUp;
        document.getElementById("form-title").innerText = isSignUp
          ? "TAPTRACKER // REGISTER"
          : "TAPTRACKER // LOGIN";
        // UWAGA: Naprawiono zmianę ID przycisku! Szuka teraz login-btn.
        document.getElementById("login-btn").innerText = isSignUp
          ? "SIGN UP"
          : "LOG IN";
        document.querySelector(".toggle-mode-btn").innerText = isSignUp
          ? "Already have an account? Log in"
          : "Need an account? Sign up";

        const errorDiv = document.getElementById("error-msg");
        if (errorDiv) errorDiv.innerText = "";
      }

      // Przypisanie do window dla onclick z HTML
      window.handleAuth = handleAuth;
      window.toggleMode = toggleMode;

      // Listen for Enter keypress to trigger login button click
      document.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          const loginBtn = document.getElementById("login-btn");
          if (loginBtn) {
            loginBtn.click();
          }
        }
      });
    </script>
  </body>
</html>
